<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile First Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
  <h2>Instagram Login Page</h2>
</header>

<div id="logo">
  <h2>INSTAGRAM</h2>
</div>

<div class="input">
  <input type="text" name="name" placeholder="Enter your name">
  <input type="email" name="email" placeholder="Enter your email">
  <button>Login</button>
</div>
<div class="content">
  <p>OR</p>
  <p>Don't have an account? <strong>Sign up</strong></p>
</div>

<div class="boxes">
  <p>Google Play</p>
  <p>App store</p>

</div>

<div class="icons">
<img src="search (1).png" alt="" width="20px">
<img src="facebook (1).png" alt="" width="20px">
<img src="twitter (1).png" alt="" width="20px">
</div>

</body>
</html>
